version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: development
    container_name: secure-image-backend-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./secure_image_encryption:/app/secure_image_encryption
      - ./uploads:/app/uploads
      - ./data:/app/data
    environment:
      - NODE_ENV=development
      - PORT=8000
      - HEDERA_NETWORK=testnet
      - LOG_LEVEL=DEBUG
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    env_file:
      - .env
    networks:
      - secure-network
    depends_on:
      - redis
      - db
    command: >
      sh -c "python -m uvicorn backend.main:app --reload --host 0.0.0.0 --port 8000"

  # Uncomment if you have a frontend
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: secure-image-frontend-dev
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   environment:
  #     - NODE_ENV=development
  #     - PORT=3000
  #     - REACT_APP_API_URL=http://localhost:8000
  #   networks:
  #     - secure-network
  #   depends_on:
  #     - backend
  #   command: >
  #     sh -c "npm start"

  # Database Adminer (for managing PostgreSQL)
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=db
    networks:
      - secure-network
    depends_on:
      - db

  # Redis Commander (for managing Redis)
  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    networks:
      - secure-network
    depends_on:
      - redis

# Development volumes
volumes:
  postgres_data:
  redis_data:
